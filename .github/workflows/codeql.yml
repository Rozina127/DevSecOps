name: "Phase 4: SAST — CodeQL Analysis"

# SAST (Static Application Security Testing)
# Ye workflow SOURCE CODE ko bina chalaye scan karta hai
# XSS, SQL Injection, Path Traversal jesi vulnerabilities dhundta hai
# GitHub Security tab mein results dikhata hai

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Har hafte Monday ko bhi scan karo (best practice)
    - cron: '30 1 * * 1'

jobs:
  codeql-analysis:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest
    
    permissions:
      # CodeQL results upload karne ke liye
      security-events: write
      # Private repo scan ke liye
      actions: read
      contents: read

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      # CodeQL ko initialize karo — JavaScript/TypeScript scan karega
      - name: "🔧 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Security aur quality dono queries chalao
          queries: security-and-quality

      # App build karo taake CodeQL code flow samajh sake
      - name: "🏗️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "📦 Install Dependencies"
        run: npm ci

      - name: "🏗️ Build Application"
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # CodeQL actual analysis run karega
      - name: "🔍 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Results SARIF format mein GitHub Security tab mein jayenge
          upload: true
