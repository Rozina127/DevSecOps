name: "Phase 5: DAST — OWASP ZAP Live Attack Test"

# DAST (Dynamic Application Security Testing)
# Ye workflow RUNNING APPLICATION par real attacks karta hai — ek hacker ki tarah!
# App ko Docker mein chalata hai, phir ZAP se attack karta hai
# Reports: HTML + JSON format mein save hoti hain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast-zap-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      # App ka Docker image build karo
      - name: "🐳 Build Docker Image"
        run: docker build -t threat-monitor-app:latest .

      # App ko background mein chalaao
      - name: "🚀 Run Application in Docker"
        run: |
          docker run -d \
            --name target-app \
            -p 3000:3000 \
            threat-monitor-app:latest
          echo "✅ App started, waiting for it to be ready..."
          sleep 15

      # App ready hai ya nahi check karo
      - name: "⏳ Wait for App to be Ready"
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ App is ready at http://localhost:3000"
              break
            fi
            echo "⏳ Attempt $i: App not ready yet, waiting 5 seconds..."
            sleep 5
          done

      # OWASP ZAP Baseline Scan — quick passive scan
      # Ye dangerous active attacks nahi karta, sirf passive check karta hai
      - name: "🕵️ OWASP ZAP Baseline Scan"
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          # ZAP ko allow karo ke fail na kare — hum sirf report chahte hain
          fail_action: false
          # Report naam
          artifact_name: 'zap-dast-report'
          # ZAP rules configuration (warnings ko ignore karo)
          allow_issue_writing: false
          cmd_options: '-a'

      # ZAP report ko artifact ke tor par save karo
      - name: "📊 Upload ZAP Report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30

      # Cleanup
      - name: "🧹 Stop Application Container"
        if: always()
        run: |
          docker stop target-app || true
          docker rm target-app || true
